<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Pankaj Kumar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0e;
            --fg: #f2f2f5;
            --mute: #8d8c98;
            --line: rgba(255, 255, 255, .09);
            --a: #7c5cff;
            --b: #22d3ee;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: Inter, system-ui, sans-serif;
            overflow-x: hidden
        }

        #cur,
        #ring {
            display: none !important
        }

        #bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            width: 0;
            background: linear-gradient(90deg, var(--a), var(--b));
            z-index: 50
        }

        #cur,
        #ring {
            position: fixed;
            left: 0;
            top: 0;
            pointer-events: none;
            z-index: 60;
            border-radius: 50%;
            display: none
        }

        @media(pointer:fine) {

            #cur,
            #ring {
                display: block
            }
        }

        #cur {
            width: 8px;
            height: 8px;
            background: #fff;
            margin: -4px 0 0 -4px
        }

        #ring {
            width: 38px;
            height: 38px;
            margin: -19px 0 0 -19px;
            border: 1px solid rgba(255, 255, 255, .4);
            transition: width .25s, height .25s, margin .25s, background .25s
        }

        #ring.big {
            width: 70px;
            height: 70px;
            margin: -35px 0 0 -35px;
            background: rgba(124, 92, 255, .15)
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 5vw;
            z-index: 40;
            mix-blend-mode: difference
        }

        nav b {
            font-family: "Space Grotesk", sans-serif;
            letter-spacing: .05em
        }

        nav div {
            display: flex;
            gap: 26px;
            font-size: 13px;
            letter-spacing: .14em;
            text-transform: uppercase
        }

        nav a {
            color: #fff;
            text-decoration: none
        }

        .hero {
            position: relative;
            height: 100vh;
            min-height: 560px;
            overflow: hidden
        }

        .glow {
            position: absolute;
            left: 50%;
            bottom: -20%;
            width: 70vmin;
            height: 70vmin;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(124, 92, 255, .35), rgba(34, 211, 238, .12) 45%, transparent 70%);
            filter: blur(30px)
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%
        }

        .nm {
            position: absolute;
            top: 44%;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 500;
            font-size: clamp(34px, 6.2vw, 110px);
            line-height: 1;
            letter-spacing: -.03em;
            pointer-events: none;
            display: flex;
            overflow: hidden
        }

        #c {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none
        }

        .orb {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(80vw, 78vh);
            height: min(80vw, 78vh);
            transform: translate(-50%, -50%);
            pointer-events: none
        }

        .orb i {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.5px dashed rgba(124, 92, 255, .45);
            animation: rot 40s linear infinite
        }

        .orb i+i {
            inset: -7%;
            border-color: rgba(34, 211, 238, .28);
            animation-duration: 60s;
            animation-direction: reverse
        }

        .orb span {
            position: absolute;
            font-family: "Space Grotesk", monospace;
            font-size: 20px;
            color: #9b8cff;
            opacity: .6;
            animation: fl 5s ease-in-out infinite
        }

        @keyframes fl {
            50% {
                transform: translateY(-14px)
            }
        }

        @keyframes rot {
            to {
                transform: rotate(360deg)
            }
        }

        .nm {
            top: 38%;
            font-size: clamp(38px, 6.2vw, 116px);
            flex-direction: column;
            line-height: .98;
            letter-spacing: -.045em;
            z-index: 3
        }

        .nm:before {
            content: "";
            width: 56px;
            height: 4px;
            border-radius: 4px;
            background: linear-gradient(90deg, #7c5cff, #22d3ee);
            margin-bottom: 26px
        }

        .nm.r:before {
            align-self: flex-end
        }

        .nm.l .l0 span {
            font-weight: 300
        }

        .nm.l .l1 span {
            font-weight: 700
        }

        .nm.r .l0 span {
            color: transparent;
            -webkit-text-stroke: 1.6px #f2f2f5;
            font-weight: 500
        }

        .nm.r .l1 span {
            font-weight: 700
        }

        .ln {
            display: flex;
            overflow: hidden;
            padding-bottom: .08em
        }

        .nm.l {
            left: 4vw
        }

        .nm.r {
            right: 4vw;
            align-items: flex-end;
            text-align: right
        }

        .nm span {
            display: inline-block;
            transform: translateY(110%);
            animation: up 1s cubic-bezier(.2, .8, .2, 1) forwards
        }

        @keyframes up {
            to {
                transform: none
            }
        }

        .scroll {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            letter-spacing: .3em;
            color: var(--mute);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-decoration: none
        }

        .scroll i {
            width: 1px;
            height: 38px;
            background: linear-gradient(var(--fg), transparent);
            animation: ln 1.8s infinite
        }

        @keyframes ln {
            0% {
                transform: scaleY(0);
                transform-origin: top
            }

            50% {
                transform: scaleY(1);
                transform-origin: top
            }

            51% {
                transform-origin: bottom
            }

            100% {
                transform: scaleY(0);
                transform-origin: bottom
            }
        }

        .gs {
            position: absolute;
            bottom: calc(32px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 16px 16px 34px;
            border-radius: 60px;
            color: #fff;
            text-decoration: none;
            font-family: "Space Grotesk", sans-serif;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: .04em;
            background: linear-gradient(120deg, #7c5cff, #22d3ee);
            box-shadow: 0 10px 40px rgba(124, 92, 255, .5);
            opacity: 0;
            animation: gsIn 1s 1.6s forwards;
            transition: box-shadow .3s, gap .3s
        }

        .gs b {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #0a0a0e;
            display: grid;
            place-items: center;
            font-weight: 400;
            transition: transform .3s
        }

        .gs:hover {
            box-shadow: 0 14px 60px rgba(34, 211, 238, .55);
            gap: 20px
        }

        .gs:hover b {
            transform: translateX(4px) rotate(-45deg)
        }

        @keyframes gsIn {
            from {
                opacity: 0;
                transform: translate(-50%, 24px)
            }

            to {
                opacity: 1;
                transform: translateX(-50%)
            }
        }

        section {
            padding: 120px 5vw 40px;
            max-width: 1200px;
            margin: auto
        }

        .tag {
            font-size: 12px;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--b);
            margin-bottom: 14px
        }

        h2 {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 500;
            font-size: clamp(34px, 5vw, 64px);
            letter-spacing: -.03em;
            margin-bottom: 46px
        }

        h2 em {
            font-style: normal;
            background: linear-gradient(90deg, var(--a), var(--b));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .mq {
            overflow: hidden;
            margin: 0 -5vw;
            padding: 10px 0;
            -webkit-mask: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
            mask: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent)
        }

        .tr {
            display: flex;
            gap: 16px;
            width: max-content;
            animation: mv 32s linear infinite
        }

        .mq.rev .tr {
            animation-direction: reverse;
            animation-duration: 38s
        }

        @keyframes mv {
            to {
                transform: translateX(-50%)
            }
        }

        .pill {
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(22px, 3vw, 38px);
            padding: 14px 32px;
            border: 1px solid var(--line);
            border-radius: 60px;
            white-space: nowrap;
            background: rgba(255, 255, 255, .03)
        }

        .cats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
            margin-top: 50px
        }

        .cat {
            padding: 26px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(255, 255, 255, .025)
        }

        .cat h3 {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 500;
            font-size: 18px;
            margin-bottom: 14px
        }

        .cat p {
            color: var(--mute);
            line-height: 1.9;
            font-size: 15px
        }

        .pj {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px
        }

        .card {
            position: relative;
            padding: 32px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background: #101016;
            overflow: hidden;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform .3s, border-color .3s
        }

        .card:before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(320px circle at var(--x, 50%) var(--y, 0%), rgba(124, 92, 255, .28), transparent 60%);
            opacity: 0;
            transition: .3s
        }

        .card:hover {
            border-color: rgba(124, 92, 255, .6);
            transform: translateY(-6px)
        }

        .card:hover:before {
            opacity: 1
        }

        .card>* {
            position: relative
        }

        .n {
            font-family: "Space Grotesk", sans-serif;
            font-size: 56px;
            color: rgba(255, 255, 255, .12);
            line-height: 1
        }

        .card h3 {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 500;
            font-size: 26px;
            margin: 20px 0 8px
        }

        .card p {
            color: var(--mute);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 18px
        }

        .t {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .t span {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .07)
        }

        footer {
            margin-top: 120px;
            border-top: 1px solid var(--line);
            padding: 70px 5vw;
            text-align: center
        }

        footer h2 {
            margin-bottom: 10px
        }

        footer p {
            color: var(--mute);
            font-size: 13px;
            letter-spacing: .1em
        }

        footer .socials {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 22px 0
        }

        footer .socials a {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            min-height: 42px;
            padding: 0 17px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, .035);
            color: var(--text);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .08em;
            text-decoration: none;
            text-transform: uppercase;
            transition: border-color .25s, background .25s, transform .25s
        }

        footer .socials a:hover {
            border-color: var(--lime);
            background: rgba(190, 242, 100, .08);
            transform: translateY(-3px)
        }

        footer .socials svg {
            width: 17px;
            height: 17px;
            fill: currentColor
        }

        .rv {
            opacity: 0;
            transform: translateY(34px);
            transition: 1s cubic-bezier(.2, .8, .2, 1)
        }

        .rv.on {
            opacity: 1;
            transform: none
        }

        @media(max-width:760px) {
            nav div {
                gap: 14px;
                font-size: 10px
            }

            .nm {
                top: auto;
                bottom: 6%;
                font-size: 9vw
            }

            .nm.l {
                left: 5vw
            }

            .nm.r {
                right: 5vw
            }
        }
    </style>
</head>

<body>
    <div id="bar"></div>
    <div id="cur"></div>
    <div id="ring"></div>
    <nav><b>PK</b>
        <div><a href="../index.html">Landing</a><a href="#skills">Skills</a><a href="#projects">Projects</a></div>
    </nav>
    <div class="hero">
        <div class="nm l" id="n1"></div>
        <div class="nm r" id="n2"></div>
    </div>

    <section id="skills">
        <div class="tag rv">What I use</div>
        <h2 class="rv">My <em>skills</em></h2>
        <div class="mq rv">
            <div class="tr" id="m1"></div>
        </div>
        <div class="mq rev rv">
            <div class="tr" id="m2"></div>
        </div>
        <div class="cats rv">
            <div class="cat">
                <h3>Frontend</h3>
                <p>HTML5 · CSS3 · JavaScript · React · Bootstrap</p>
            </div>
            <div class="cat">
                <h3>Programming &amp; Data</h3>
                <p>Python · C · MySQL · Miniconda</p>
            </div>
            <div class="cat">
                <h3>Hardware</h3>
                <p>Arduino</p>
            </div>
            <div class="cat">
                <h3>Design</h3>
                <p>Figma · Canva</p>
            </div>
        </div>
    </section>

    <section id="projects">
        <div class="tag rv">Selected work</div>
        <h2 class="rv">My <em>projects</em></h2>
        <div class="pj" id="pj"></div>
    </section>

    <footer class="rv">
        <h2>Pankaj <em>Kumar</em></h2>
        <div class="socials"><a href="https://github.com/PankajKumar" target="_blank" rel="noopener noreferrer"
                aria-label="GitHub profile"><svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 .7a11.3 11.3 0 0 0-3.57 22c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.34-3.8-1.34-.51-1.31-1.26-1.66-1.26-1.66-1.03-.71.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.74 2.66 1.24 3.31.95.1-.74.4-1.24.72-1.52-2.51-.29-5.15-1.26-5.15-5.58 0-1.23.44-2.24 1.16-3.03-.12-.29-.5-1.44.11-3 0 0 .95-.3 3.12 1.16a10.8 10.8 0 0 1 5.68 0c2.16-1.46 3.11-1.16 3.11-1.16.62 1.56.23 2.71.12 3A4.35 4.35 0 0 1 19 12.4c0 4.33-2.64 5.29-5.16 5.57.41.35.77 1.04.77 2.09v3.1c0 .3.2.65.78.54A11.3 11.3 0 0 0 12 .7Z" />
                </svg><span>GitHub</span></a><a href="https://www.linkedin.com/in/pankaj-kumar" target="_blank"
                rel="noopener noreferrer" aria-label="LinkedIn profile"><svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M5.2 3.6A2.6 2.6 0 1 0 5.2 8.8a2.6 2.6 0 0 0 0-5.2ZM3 10.2h4.4V21H3V10.2Zm7.1 0h4.2v1.47h.06c.59-1.11 2.02-2.28 4.16-2.28 4.45 0 5.27 2.93 5.27 6.74V21h-4.4v-4.3c0-1.03-.02-2.35-1.43-2.35-1.43 0-1.65 1.12-1.65 2.27V21h-4.4V10.2h-1.81Z" />
                </svg><span>LinkedIn</span></a></div>
        <p>© 2026 · BUILT WITH  PK</p>
    </footer>

    <script>
        const $ = id => document.getElementById(id);
        function split(el, L, d) { el.innerHTML = L.map((t, k) => `<div class="ln l${k}">` + [...t].map((c, i) => `<span style="animation-delay:${d + k * .25 + i * .05}s">${c}</span>`).join("") + `</div>`).join("") }
        split($("n1"), ["Pankaj", "Kumar"], .4); split($("n2"), ["Frontend", "Developer"], .9);
        const sk = "HTML5,CSS3,JavaScript,React,Bootstrap,Python,C,MySQL,Miniconda,Arduino,Canva,Figma".split(",");
        const row = a => [...a, ...a].map(s => `<span class="pill">${s}</span>`).join("");
        $("m1").innerHTML = row(sk.slice(0, 6)); $("m2").innerHTML = row(sk.slice(6).concat(["Python", "React"]));
        const pr = [["Python Games", "Arcade-style games coded in Python.", ["Python", "Games"]], ["CareerMatch-By-PK", "Helps students match with the right career path.", ["Python", "MySQL"]], ["DevTrack", "Track your developer work and progress.", ["React", "JavaScript"]], ["Qvanta", "A modern project built around the Qvanta idea.", ["React", "Figma"]]];
        $("pj").innerHTML = pr.map((p, i) => `<div class="card rv"><div><div class="n">0${i + 1}</div><h3>${p[0]}</h3><p>${p[1]}</p></div><div class="t">${p[2].map(t => `<span>${t}</span>`).join("")}</div></div>`).join("");
        document.querySelectorAll(".card").forEach(c => c.addEventListener("pointermove", e => { const r = c.getBoundingClientRect(); c.style.setProperty("--x", e.clientX - r.left + "px"); c.style.setProperty("--y", e.clientY - r.top + "px") }));
        const io = new IntersectionObserver(e => e.forEach(x => x.isIntersecting && x.target.classList.add("on")), { threshold: .12 });
        document.querySelectorAll(".rv").forEach(e => io.observe(e));
        /* cursor + progress */
        let cx = 0, cy = 0, rx = 0, ry = 0;
        addEventListener("pointermove", e => { cx = e.clientX; cy = e.clientY; $("cur").style.transform = `translate(${cx}px,${cy}px)` });
        document.querySelectorAll("a,.card,.pill").forEach(e => { e.addEventListener("pointerenter", () => $("ring").classList.add("big")); e.addEventListener("pointerleave", () => $("ring").classList.remove("big")) });
        const hero = document.querySelector(".hero");
        addEventListener("scroll", () => { const s = scrollY, m = document.documentElement.scrollHeight - innerHeight; $("bar").style.width = s / m * 100 + "%"; cv.style.transform = `translateY(${s * .25}px)`; cv.style.opacity = Math.max(0, 1 - s / (innerHeight * .9)) });
        const cv = document.createElement("div");
        (function loop() { rx += (cx - rx) * .15; ry += (cy - ry) * .15; $("ring").style.transform = `translate(${rx}px,${ry}px)`; requestAnimationFrame(loop) })();
    </script>
</body>

</html>
